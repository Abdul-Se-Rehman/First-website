 <script>
  // ---------- marks you got, and marks that were possible so far ----------
  let obtained = 0;
  let possible = 0;

  // add ONE box: skipped if empty (not done yet)
  function add(id) {
    let box = document.getElementById(id);
    if (box.value === "") return;

    let n = Number(box.value);
    let max = Number(box.max);
    if (n > max) n = max;
    if (n < 0) n = 0;

    obtained += n;
    possible += max;
  }

  // percentage of the work done so far (-1 means nothing entered)
  function percent() {
    if (possible === 0) return -1;
    return obtained / possible * 100;
  }

  // ---------- one function per subject ----------
  function calculus() {
    obtained = 0; possible = 0;
    add("calcQUIZ1"); add("calcQUIZ2"); add("calcQUIZ3"); add("calcQUIZ4");
    add("calcASSIGN1"); add("calcASSIGN2"); add("calcASSIGN3"); add("calcASSIGN4");
    add("CalcMid"); add("CalcFinal");
    return percent();
  }

  function fop() {
    obtained = 0; possible = 0;
    add("fopQUIZ1"); add("fopQUIZ2"); add("fopQUIZ3"); add("fopQUIZ4");
    add("fopASSIGN1"); add("fopASSIGN2"); add("fopASSIGN3"); add("fopASSIGN4");
    add("fopMID"); add("fopFINAL");
    return percent();
  }

  function fopLab() {
    obtained = 0; possible = 0;
    add("fopLabtask1"); add("fopLabtask2"); add("fopLabtask3");
    add("fopLabtask4"); add("fopLabtask5"); add("fopLabtask6");
    add("fopProject1"); add("fopProject2");
    add("fopLabMID"); add("fopLabFINAL");
    return percent();
  }

  function english() {
    obtained = 0; possible = 0;
    add("engQUIZ1"); add("engQUIZ2"); add("engQUIZ3"); add("engQUIZ4");
    add("engASSIGN1"); add("engASSIGN2"); add("engASSIGN3"); add("engASSIGN4");
    add("engMid"); add("engFinal");
    return percent();
  }

  function itc() {
    obtained = 0; possible = 0;
    add("itcQUIZ1"); add("itcQUIZ2"); add("itcQUIZ3");
    add("itcASSIGN1"); add("itcASSIGN2"); add("itcASSIGN3");
    add("itcMID"); add("itcFINAL");
    return percent();
  }

  function itcLab() {
    obtained = 0; possible = 0;
    add("itcLabtask1"); add("itcLabtask2"); add("itcLabtask3");
    add("itcLabtask4"); add("itcLabtask5"); add("itcLabtask6");
    add("itcProject1"); add("itcProject2");
    add("itcLabMid"); add("itcLabFinal");
    return percent();
  }

  function physics() {
    obtained = 0; possible = 0;
    add("phyQUIZ1"); add("phyQUIZ2"); add("phyQUIZ3"); add("phyQUIZ4");
    add("phyASSIGN1"); add("phyASSIGN2"); add("phyASSIGN3"); add("phyASSIGN4");
    add("phyMid"); add("phyFinal");
    return percent();
  }

  function physicsLab() {
    obtained = 0; possible = 0;
    add("phyPractical1"); add("phyPractical2");
    add("phyProject1"); add("phyProject2");
    add("phyLabMid"); add("phyLabFinal");
    return percent();
  }

  // ---------- your university scale ----------
  function gradePoint(p) {
    if (p >= 90) return 4.00;
    else if (p >= 85) return 3.75;
    else if (p >= 80) return 3.50;
    else if (p >= 75) return 3.25;
    else if (p >= 70) return 3.00;
    else if (p >= 66) return 2.75;
    else if (p >= 63) return 2.50;
    else if (p >= 60) return 2.00;
    else if (p >= 55) return 1.50;
    else return 0;
  }

  // ---------- totals ----------
  let totalPoints = 0;
  let totalCredits = 0;
  let output = "";

  // adds one subject to the totals and to the output text
  function addSubject(name, credits, p) {
    if (p < 0) return;                 // nothing entered, skip
    let gp = gradePoint(p);
    totalPoints += gp * credits;
    totalCredits += credits;
    output += name + ": " + obtained.toFixed(1) + " / " + possible.toFixed(1) +
              " = " + p.toFixed(1) + "%, GP " + gp.toFixed(2) + "<br>";
  }

  // ---------- "main": runs when the button is clicked ----------
  document.getElementById("calcbtn").addEventListener("click", function () {
    totalPoints = 0;
    totalCredits = 0;
    output = "";

    addSubject("Calculus", 3, calculus());
    addSubject("FOP", 3, fop());
    addSubject("FOP Lab", 1, fopLab());
    addSubject("English", 3, english());
    addSubject("ITC", 2, itc());
    addSubject("ITC Lab", 1, itcLab());
    addSubject("Applied Physics", 2, physics());
    addSubject("Physics Lab", 1, physicsLab());

    if (totalCredits === 0) {
      output = "Please enter some marks first.";
    } else {
      output += "<br><b>GPA so far: " + (totalPoints / totalCredits).toFixed(2) + "</b>";
    }
    document.getElementById("result").innerHTML = output;
  });
</script>
