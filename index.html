         <div>

    <section>
        <button id="calcbtn">Calculate GPA</button>
        <div id="result"></div>

    </section>
  </MAIN> 
  
  <script>
    function val(id) {
      return Number(document.getElementById(id).value) || 0;
    }

    function calculus() {
      return val("calcQUIZ1") + val("calcQUIZ2") + val("calcQUIZ3") + val("calcQUIZ4")
           + val("calcASSIGN1") + val("calcASSIGN2") + val("calcASSIGN3") + val("calcASSIGN4")
           + val("CalcMid") + val("CalcFinal");
    }

    document.getElementById("calcbtn").addEventListener("click", function () {
      let c = calculus();
      document.getElementById("result").textContent = "Calculus total: " + c + " / 100";
    });
  </script>
</body>
</html>
